name: Airbnb-Kalender synchronisieren

on:
  schedule:
    - cron: '17 */3 * * *'      # alle 3 Stunden
  workflow_dispatch:            # zum Auslösen von Hand

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: iCal holen, Plan rechnen, Dateien schreiben
        env:
          ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          PFAD: hgsnhbszcpvn08zk
          ANCHOR: '2026-09-05'
        run: python3 sync.py

      - name: Änderung übernehmen
        run: |
          git config user.name  "Airbnb-Sync"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && echo "nichts zu tun" && exit 0
          git commit -m "Kalender aktualisiert $(date -u +%F\ %H:%M)"
          git push
